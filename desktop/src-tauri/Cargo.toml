# Deliberately outside the main cargo workspace (see root Cargo.toml `exclude`):
# building Tauri requires GUI system libraries (webkit2gtk on Linux, etc.) that
# the daemon/TUI build must never depend on.
# An explicit empty workspace keeps this crate standalone even when the parent
# directory tree nests inside another cargo workspace (e.g. a git worktree).
[workspace]

[package]
name = "warpforge-desktop"
version = "0.11.1"
edition = "2021"
description = "Warpforge desktop shell — a thin Tauri client for the warpforge daemon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Wire types only — never daemon internals.
warpforge-protocol = { path = "../../crates/warpforge-protocol" }
env_logger = "0.11"

# Keep this last. Placed mid-`[dependencies]` it silently swallows every entry
# below it, so `serde_json`, `dirs` and `warpforge-protocol` become macOS-only
# and the Linux build fails on unresolved imports rather than on anything to do
# with notifications.
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
