name: Homebrew tap

# Syncs ephor/homebrew-tap cask for desktop app.
# macOS: DMG, Linux: AppImage via linuxbrew. rpm/deb stay as direct
# downloads from Releases (dnf/dpkg) — both channels valid.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  cask:
    name: Sync ephor/homebrew-tap cask (macOS + Linux AppImage)
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - name: Require the token that authorizes pushes to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: test -n "$TOKEN" || { echo "Missing HOMEBREW_GITHUB_API_TOKEN secret" >&2; exit 1; }

      - name: Download checksums from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo warpforgehq/warpforge \
            --pattern 'SHA256SUMS' --dir .
          cat SHA256SUMS

      - name: Extract checksums
        id: sha
        run: |
          dmg_sha="$(awk -v pat="Warpforge_${VERSION#v}_aarch64.dmg" '$2 == pat {print $1}' SHA256SUMS)"
          test -n "$dmg_sha" || { echo "No Warpforge_${VERSION#v}_aarch64.dmg in SHA256SUMS" >&2; exit 1; }
          appimage_sha="$(awk '$2 ~ /^Warpforge_.*_amd64\.AppImage$/ {print $1}' SHA256SUMS | head -n1)"
          test -n "$appimage_sha" || { echo "No AppImage in SHA256SUMS (expected Warpforge_*_amd64.AppImage)" >&2; exit 1; }
          echo "dmg_sha=$dmg_sha" >> "$GITHUB_OUTPUT"
          echo "appimage_sha=$appimage_sha" >> "$GITHUB_OUTPUT"

      - name: Bump the cask and push
        env:
          SHA_DMG: ${{ steps.sha.outputs.dmg_sha }}
          SHA_APPIMAGE: ${{ steps.sha.outputs.appimage_sha }}
          TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${TOKEN}@github.com/ephor/homebrew-tap" tap
          cd tap
          cat > Casks/warpforge.rb <<RUBY
          cask "warpforge" do
            version "${VERSION#v}"

            on_macos do
              sha256 "${SHA_DMG}"
              url "https://github.com/warpforgehq/warpforge/releases/download/v#{version}/Warpforge_#{version}_aarch64.dmg"
            end
            on_linux do
              sha256 "${SHA_APPIMAGE}"
              url "https://github.com/warpforgehq/warpforge/releases/download/v#{version}/Warpforge_${version}_amd64.AppImage"
            end

            name "Warpforge"
            desc "Workspace orchestrator with embedded agent terminals"
            homepage "https://github.com/warpforgehq/warpforge"

            livecheck do
              url :stable
              strategy :github_latest
            end

            auto_updates true
            app "Warpforge.app" if OS.mac?
            binary "Warpforge_\#{version}_amd64.AppImage", target: "warpforge" if OS.linux?
          end
          RUBY
          if git diff --exit-code --quiet; then
            echo "Cask already at ${VERSION}"
            exit 0
          fi
          git config user.name "warpforge-ci"
          git config user.email "ci@warpforge.local"
          git commit -am "warpforge ${VERSION#v}"
          git push -q
