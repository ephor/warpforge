name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable vX.Y.Z tag to release
        required: true
        type: string
      include_windows_x64:
        description: Also build Windows x64 desktop and CLI preview artifacts
        required: true
        default: false
        type: boolean
      include_linux_x64:
        description: Also build Linux x64 desktop and CLI preview artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate tagged source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    outputs:
      desktop_matrix: ${{ steps.matrix.outputs.desktop_matrix }}
      cli_matrix: ${{ steps.matrix.outputs.cli_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify immutable tag and synchronized versions
        env:
          RELEASE_TAG: ${{ inputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "version must be an existing stable vX.Y.Z tag" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$tag_sha" = "$(git rev-parse HEAD)" || {
            echo "checkout does not match refs/tags/$RELEASE_TAG" >&2
            exit 1
          }
          bun scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            lld \
            patchelf
      - run: cargo fmt --all --check
      - name: Build Rust tests
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 5m \
            cargo test --locked --no-run >cargo-test-build.log 2>&1 || status=$?
          cat cargo-test-build.log
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            ps -eo pid,ppid,stat,etime,cmd --forest
          fi
          exit "$status"
        timeout-minutes: 15
      - name: Run Rust tests
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 3m \
            cargo test --locked >cargo-test-run.log 2>&1 || status=$?
          cat cargo-test-run.log
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            ps -eo pid,ppid,stat,etime,cmd --forest
          fi
          exit "$status"
        timeout-minutes: 5
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run lint
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop
      - run: bun run test
        working-directory: desktop
      - run: bun desktop/scripts/stage-sidecar.mjs --profile debug
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Select release targets
        id: matrix
        env:
          INCLUDE_WINDOWS: ${{ inputs.include_windows_x64 }}
          INCLUDE_LINUX: ${{ inputs.include_linux_x64 }}
        run: |
          desktop='{"include":[{"label":"macOS arm64","os":"macos-14","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin","macos":true}]}'
          cli='{"include":[{"os":"macos-14","target":"aarch64-apple-darwin","cross":false}]}'
          if [ "$INCLUDE_WINDOWS" = true ]; then
            desktop="$(jq -c '.include += [{"label":"Windows x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","args":"--target x86_64-pc-windows-msvc --bundles nsis","macos":false}]' <<<"$desktop")"
            cli="$(jq -c '.include += [{"os":"windows-latest","target":"x86_64-pc-windows-msvc","cross":false}]' <<<"$cli")"
          fi
          if [ "$INCLUDE_LINUX" = true ]; then
            desktop="$(jq -c '.include += [{"label":"Linux x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":"--target x86_64-unknown-linux-gnu --bundles appimage,deb","macos":false}]' <<<"$desktop")"
            cli="$(jq -c '.include += [
              {"os":"ubuntu-22.04","target":"aarch64-unknown-linux-gnu","cross":true},
              {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","cross":false}
            ]' <<<"$cli")"
          fi
          echo "desktop_matrix=$desktop" >> "$GITHUB_OUTPUT"
          echo "cli_matrix=$cli" >> "$GITHUB_OUTPUT"

  release-gate:
    name: Approve signed release
    needs: preflight
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Require updater signing credentials
        env:
          TAURI_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_PUBLIC_KEY" || { echo "Missing repository variable TAURI_UPDATER_PUBLIC_KEY" >&2; exit 1; }
          CONFIGURED_PUBLIC_KEY="$(node -p "require('./desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          test "$TAURI_PUBLIC_KEY" = "$CONFIGURED_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY does not match tauri.conf.json" >&2; exit 1; }
          test -n "$TAURI_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }

  prepare-release:
    name: Create draft
    needs: release-gate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reset the exact draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId 2>/dev/null)"; then
            release_json="$(gh api "repos/$GH_REPO/releases/$release_id")"
            draft="$(jq -r .draft <<<"$release_json")"
            test "$draft" = true || { echo "Release $RELEASE_TAG is already published" >&2; exit 1; }

            # A rerun may select a different preview matrix. Remove every old
            # asset so stale installers cannot remain advertised by latest.json.
            jq -r '.assets[].id' <<<"$release_json" | while IFS= read -r asset_id; do
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            done
          else
            release_json="$(
              gh api --method POST "repos/$GH_REPO/releases" \
                -f tag_name="$RELEASE_TAG" \
                -f name="Warpforge ${RELEASE_TAG#v}" \
                -F draft=true \
                -F generate_release_notes=true
            )"
          fi
          echo "release_id=$(jq -r .id <<<"$release_json")" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [preflight, prepare-release]
    strategy:
      fail-fast: false
      # Each invocation merges its platform into latest.json. Serializing the
      # matrix prevents two jobs from overwriting the same release asset.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          shared-key: release-${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Validate Apple credentials and prepare App Store Connect private key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo "Missing APPLE_CERTIFICATE" >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing APPLE_CERTIFICATE_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER" >&2; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "Missing APPLE_API_KEY" >&2; exit 1; }
          test -n "$APPLE_API_PRIVATE_KEY" || { echo "Missing APPLE_API_PRIVATE_KEY" >&2; exit 1; }

          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          first_line="$(sed -n '1p' "$key_path" | tr -d '\r')"
          last_line="$(awk 'NF { line = $0 } END { sub(/\r$/, "", line); print line }' "$key_path")"
          test "$first_line" = "-----BEGIN PRIVATE KEY-----" &&
            test "$last_line" = "-----END PRIVATE KEY-----" &&
            test "$(grep -c '^-----BEGIN PRIVATE KEY-----' "$key_path")" -eq 1 &&
            test "$(grep -c '^-----END PRIVATE KEY-----' "$key_path")" -eq 1 || {
              echo "APPLE_API_PRIVATE_KEY is not a complete PKCS#8 PEM private key" >&2
              exit 1
            }
          openssl pkey -in "$key_path" -noout >/dev/null 2>&1 || {
            echo "APPLE_API_PRIVATE_KEY could not be parsed as a private key" >&2
            exit 1
          }

          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      # v1 pinned to an immutable commit; updater metadata is release-critical.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.macos && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.macos && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_ISSUER: ${{ matrix.macos && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.macos && secrets.APPLE_API_KEY || '' }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ inputs.version }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: Notarize and verify final macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          bundle_root="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          app_paths=("$bundle_root"/macos/*.app)
          dmg_paths=("$bundle_root"/dmg/*.dmg)
          test "${#app_paths[@]}" -eq 1 || {
            echo "Expected exactly one macOS app bundle under $bundle_root/macos" >&2
            exit 1
          }
          test "${#dmg_paths[@]}" -eq 1 || {
            echo "Expected exactly one DMG under $bundle_root/dmg" >&2
            exit 1
          }
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"

          verify_developer_id_authority() {
            local artifact="$1"
            local signature_info
            signature_info="$(codesign -d --verbose=4 "$artifact" 2>&1)"
            grep -q '^Authority=Developer ID Application:' <<<"$signature_info" || {
              echo "Developer ID Application authority not found on $artifact" >&2
              exit 1
            }
          }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          verify_developer_id_authority "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          # Tauri notarizes the app before creating the DMG. Submit the final
          # disk image separately, staple its ticket, then replace the
          # previously uploaded unstapled asset in the draft.
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          codesign --verify --strict --verbose=2 "$dmg_path"
          verify_developer_id_authority "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber
      - name: Clean up App Store Connect private key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  cli:
    name: CLI ${{ matrix.target }}
    needs: [preflight, prepare-release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.cli_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-release-${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build archive
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
          binary="target/${{ matrix.target }}/release/warpforge"
          if [ "${{ runner.os }}" = Windows ]; then binary="${binary}.exe"; fi
          tar -czf "warpforge-${{ matrix.target }}.tar.gz" -C "$(dirname "$binary")" "$(basename "$binary")"
          gh release upload "$RELEASE_TAG" "warpforge-${{ matrix.target }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}

  verify-draft:
    name: Verify draft assets
    needs: [prepare-release, desktop, cli]
    if: ${{ always() && needs.prepare-release.result == 'success' && needs.desktop.result == 'success' && needs.cli.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows_x64 }}
          INCLUDE_LINUX: ${{ inputs.include_linux_x64 }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

          # Draft assets use authenticated API URLs until publication. Resolve
          # those IDs to their real asset names and write the stable tagged
          # download URLs that installed apps can use after publication.
          release_json="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          asset_names="$(
            jq -c '[.assets[] | {key: (.id | tostring), value: .name}] | from_entries' \
              <<<"$release_json"
          )"
          canonical_base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          jq --arg base "$canonical_base" --argjson names "$asset_names" '
            .platforms |= with_entries(
              .value.url |= (
                if test("^https://api.github.com/.*/releases/assets/[0-9]+$")
                then capture("/assets/(?<id>[0-9]+)$").id as $id
                  | $base + "/" + (
                      $names[$id]
                      // error("latest.json references unknown release asset id \($id)")
                    )
                else .
                end
              )
            )
          ' release-assets/latest.json > release-assets/latest.normalized.json
          mv release-assets/latest.normalized.json release-assets/latest.json

          test -f release-assets/latest.json
          test -f release-assets/warpforge-aarch64-apple-darwin.tar.gz
          if [ "$INCLUDE_WINDOWS" = true ]; then
            test -f release-assets/warpforge-x86_64-pc-windows-msvc.tar.gz
          fi
          if [ "$INCLUDE_LINUX" = true ]; then
            test -f release-assets/warpforge-aarch64-unknown-linux-gnu.tar.gz
            test -f release-assets/warpforge-x86_64-unknown-linux-gnu.tar.gz
          fi
          jq -e --arg version "${RELEASE_TAG#v}" '.version == $version' release-assets/latest.json
          jq -e '
            .platforms
            | length > 0 and all(.[];
                (.url | type) == "string" and (.url | length) > 0 and
                (.signature | type) == "string" and (.signature | length) > 0
              )
          ' release-assets/latest.json
          jq -e '.platforms | keys | any(.[]; startswith("darwin-aarch64"))' release-assets/latest.json
          if [ "$INCLUDE_WINDOWS" = true ]; then
            jq -e '.platforms | keys | any(.[]; startswith("windows-x86_64"))' release-assets/latest.json
          else
            jq -e '.platforms | keys | all(.[]; startswith("windows-x86_64") | not)' release-assets/latest.json
          fi
          if [ "$INCLUDE_LINUX" = true ]; then
            jq -e '.platforms | keys | any(.[]; startswith("linux-x86_64"))' release-assets/latest.json
          else
            jq -e '.platforms | keys | all(.[]; startswith("linux-x86_64") | not)' release-assets/latest.json
          fi
          jq -er '.platforms[].url' release-assets/latest.json | while IFS= read -r url; do
            case "$url" in
              *"/releases/download/$RELEASE_TAG/"*) ;;
              *) echo "Updater URL does not use the immutable release tag: $url" >&2; exit 1 ;;
            esac
            asset="${url##*/}"
            test -f "release-assets/$asset" || { echo "Missing updater asset: $asset" >&2; exit 1; }
            test -f "release-assets/$asset.sig" || { echo "Missing updater signature: $asset.sig" >&2; exit 1; }
          done
          cd release-assets
          gh release upload "$RELEASE_TAG" latest.json --clobber
          sha256sum -- * > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft)" = true
          echo "Draft verified. Install and update-test these assets before publishing:"
          gh release view "$RELEASE_TAG" --json url --jq .url
