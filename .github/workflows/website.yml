name: Website

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "desktop/src/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# One deploy at a time, and let a newer push win rather than queue behind an
# older one — the site is a snapshot of main, not a sequence of states.
concurrency:
  group: website-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The landing page compiles components out of `desktop/src`, and points
      # Tailwind at the app's config, which loads plugins from the app's tree.
      - name: Install the app's dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      # The demo runs on the app's demo mode, which answers an RPC it does not
      # recognise with `{}` — so the site can build green while the hero
      # renders nothing. Never deploy without checking the run plays through.
      - run: bun run test:demo
      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
