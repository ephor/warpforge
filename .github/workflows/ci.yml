name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Advisory: a pull request without a changeset ships no release note and
      # no version bump. That is legitimate for chores, so this never blocks.
      - name: Report pending release impact
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}"
          bun run changeset status --since "origin/${{ github.base_ref }}"

  rust:
    name: Rust daemon and protocol
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: root
          cache-on-failure: true
      - name: Install Linux portal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev lld
      - run: cargo fmt --all --check
      - name: Build Rust tests
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 5m \
            cargo test --locked --no-run >cargo-test-build.log 2>&1 || status=$?
          cat cargo-test-build.log
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            ps -eo pid,ppid,stat,etime,cmd --forest
          fi
          exit "$status"
        timeout-minutes: 15
      - name: Run Rust tests
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 3m \
            cargo test --locked >cargo-test-run.log 2>&1 || status=$?
          cat cargo-test-run.log
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            ps -eo pid,ppid,stat,etime,cmd --forest
          fi
          exit "$status"
        timeout-minutes: 5
      - run: cargo clippy --locked --all-targets -- -D warnings

  desktop-web:
    name: Desktop web
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  website:
    name: Website
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The landing page compiles the desktop app's components, and points
      # Tailwind at the app's config — which loads its plugins from the app's
      # own tree. Runtime imports are routed through this site's packages so
      # the page ends up with one React; this install is for the build.
      - name: Install the app's dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:docs
      # The landing page compiles components out of `desktop/src`, so this
      # build is what notices when a refactor there reaches the website.
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      # A build is not enough on its own: the app's demo mode answers an RPC it
      # does not recognise with `{}`, so the site can keep building while the
      # hero quietly renders nothing. This plays the run and checks it happened.
      - run: bun run test:demo

  desktop-rust:
    name: Desktop Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: desktop-linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - run: bun desktop/scripts/stage-sidecar.mjs --profile debug
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
